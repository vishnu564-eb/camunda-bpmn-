# Server Configuration
server.port=8085
spring.application.name=camunda8-workflow-workers

# Camunda 8 / Zeebe Configuration
# For local Zeebe broker (docker-compose / desktop)
zeebe.client.broker.gateway-address=127.0.0.1:26500
zeebe.client.security.plaintext=true

# For Camunda 8 SaaS (uncomment and populate when connecting to Camunda 8 Cloud)
# zeebe.client.cloud.cluster-id=YOUR_CLUSTER_ID
# zeebe.client.cloud.client-id=YOUR_CLIENT_ID
# zeebe.client.cloud.client-secret=YOUR_CLIENT_SECRET
# zeebe.client.cloud.region=bru-2

# Camunda Auto Deployment of BPMN and DMN models
camunda.auto-deploy.bpmn-resources=classpath*:models/*.bpmn
camunda.auto-deploy.dmn-resources=classpath*:models/*.dmn

# Logging configuration
logging.level.com.camunda.labs=INFO
logging.level.io.camunda.zeebe.client=INFO
logging.level.org.springframework.web=INFO
